<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        #app {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <h1>Data dari Google Sheet</h1>
    <div id="app">Memuat data...</div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbylZGBlgnBkp2w5tYM2W5Fk7jxyyNPcpwRR1xFOxuULPdAHPU-lyXQAkv2mwzj9BMA/exec";

        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                console.log("Sukses:", data);
                document.getElementById("app").innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("app").innerHTML = "Gagal memuat data. Pastikan URL Apps Script sudah benar dan dapat diakses.";
            });
    </script>
</body>
</html>
